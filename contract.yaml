plane_work_item: local-rttys-tenant
slice: tenant-local group management and union device authorization
lane: high-risk
base_branch: master
claim:
  kind: integration_health
  statement: Tenant-scoped group CRUD and multi-group device access preserve any remaining
    authorization
  intent_ref: user-request-this-chat
  does_not_prove:
  - production readiness
  - high availability
  - command rollback
business:
  actor: tenant administrators and device operators
  workflow: enroll devices, grant access, operate terminal/files/web, revoke access
  problem: single device group and unconditional session revocation prevent multi-team
    maintenance
  baseline: 4d022ee supports one group and closes all user leases on grant edits
  target: multi-group membership with union authorization and selective lease invalidation
  outcome: independently usable authenticated remote maintenance platform
  evidence_sources:
  - DELIVERY.md
  - scripts/tenant-e2e.py
  - cmd/tenant-e2e/main.go
  outcome_measurement:
    status: planned
    metrics:
    - name: authorized_and_denied_behavior
      direction: threshold
      baseline: no tenant isolation
      target: all required negative and positive paths pass
      source: evidence delivery receipt
    observation_window: local and isolated 204 test run
    reason: ''
harness:
  bootstrap:
    status: available
    probe: go build ./cmd/rttys
  reset:
    status: available
    probe: scripts/run-local-e2e.py creates disposable SQLite fixture
  focused_test:
    status: available
    probe: python3 scripts/run-local-e2e.py
  ground_truth:
    status: available
    probe: compare transport observations with user-defined policy in DELIVERY.md
    oracle_kind: human_gold
    uri: DELIVERY.md
    digest: ''
    independent_from_sut_input: true
  fixtures:
    status: available
    probe: synthetic tenants and devices plus NVIDIA 172.21.0.156
  architecture_check:
    status: not_applicable
    reason: manual security boundary review and full transport checks cover this single-process
      fork
  secret_policy: redact
allowed_paths:
- cmd/**
- internal/**
- ui/**
- scripts/**
- go.mod
- go.sum
- contract.yaml
- DELIVERY.md
- .gitignore
- README-TENANT.md
- THIRD_PARTY.md
non_goals:
- production cutover
- SSO
- clustering
- shell command sandbox
- serial and sharing
invariants:
- tenant identity is derived from authenticated membership and enrolled credentials
- existing edge-manager edits and other remote services are untouched
- no secrets are committed
acceptance:
- id: AC-G1
  given: tenant administrators and existing single-group data
  when: migrate, create, rename, delete groups and assign devices to multiple groups
  then: legacy membership persists, changes are atomic and tenant scoped, deleted
    grants never resurrect
- id: AC-G2
  given: live terminal file and proxy with multiple grant sources
  when: remove one group grant or membership then remove the last effective grant
  then: remaining access preserves channels; zero access closes channels and denies
    new ones
- id: AC-G3
  given: 204 test deployment and 156 real NVIDIA client
  when: manage groups in browser and replay multi-group authorization
  then: group management is usable and real terminal/file/proxy demonstrate union
    and revocation
proof:
  evidence_tier: deployment-real
  acceptance_owner: user
  artifact_root: external daily memo rttys-tenant
  commands:
  - python3 scripts/run-local-e2e.py
  - deployed real-device acceptance
rollback: Stop service; restore matched pre-groups binary and stopped SQLite database.
  Binary-only rollback is not valid after migration.
open_questions: []
execution:
  environments:
    local: read-write
    test: read-write
    production: forbidden
