plane_work_item: local-rttys-tenant
slice: RTTY console information architecture and visual redesign
lane: high-risk
base_branch: master
claim:
  kind: integration_health
  statement: Readable role-aware console navigation, focused device operations and
    preserved management workflows
  intent_ref: user-request-this-chat
  does_not_prove:
  - production readiness
  - high availability
  - command rollback
business:
  actor: tenant administrators and device operators
  workflow: enroll devices, grant access, operate terminal/files/web, revoke access
  problem: single long management page and terminal gray theme make administration
    cluttered
  baseline: a851304 stacks all management sections
  target: separate navigable functional sections with legible light surfaces and clear
    hierarchy
  outcome: independently usable authenticated remote maintenance platform
  evidence_sources:
  - DELIVERY.md
  - scripts/tenant-e2e.py
  - cmd/tenant-e2e/main.go
  outcome_measurement:
    status: planned
    metrics:
    - name: authorized_and_denied_behavior
      direction: threshold
      baseline: no tenant isolation
      target: all required negative and positive paths pass
      source: evidence delivery receipt
    observation_window: local and isolated 204 test run
    reason: ''
harness:
  bootstrap:
    status: available
    probe: go build ./cmd/rttys
  reset:
    status: available
    probe: scripts/run-local-e2e.py creates disposable SQLite fixture
  focused_test:
    status: available
    probe: python3 scripts/run-local-e2e.py
  ground_truth:
    status: available
    probe: compare transport observations with user-defined policy in DELIVERY.md
    oracle_kind: human_gold
    uri: DELIVERY.md
    digest: ''
    independent_from_sut_input: true
  fixtures:
    status: available
    probe: synthetic tenants and devices plus NVIDIA 172.21.0.156
  architecture_check:
    status: not_applicable
    reason: manual security boundary review and full transport checks cover this single-process
      fork
  secret_policy: redact
allowed_paths:
- cmd/**
- internal/**
- ui/**
- scripts/**
- go.mod
- go.sum
- contract.yaml
- DELIVERY.md
- .gitignore
- README-TENANT.md
- THIRD_PARTY.md
non_goals:
- production cutover
- SSO
- clustering
- shell command sandbox
- serial and sharing
invariants:
- tenant identity is derived from authenticated membership and enrolled credentials
- existing edge-manager edits and other remote services are untouched
- no secrets are committed
acceptance:
- id: UI-1
  given: tenant admin on desktop
  when: open workspace and navigate sections
  then: light console has clear navigation, device metrics, focused tables and separate
    groups members access audit sections
- id: UI-2
  given: current device groups and members
  when: open group settings and browse management
  then: existing selection, save/cancel, enrollment and membership controls remain
    available without changing authorization APIs
- id: UI-3
  given: operator and login page
  when: sign in and open console
  then: login is readable, restricted management navigation stays hidden and device
    actions remain available
proof:
  evidence_tier: deployment-real
  acceptance_owner: user
  artifact_root: external daily memo rttys-tenant
  commands:
  - python3 scripts/run-local-e2e.py
  - deployed real-device acceptance
rollback: Stop service; restore matched pre-groups binary and stopped SQLite database.
  Binary-only rollback is not valid after migration.
open_questions: []
execution:
  environments:
    local: read-write
    test: read-write
    production: forbidden
