plane_work_item: local-rttys-tenant
slice: bounded download window with cancellation and transfer isolation
lane: high-risk
base_branch: master
claim:
  kind: integration_health
  statement: Windowed downloads preserve file integrity across cancel, sequential
    files and reconnect
  intent_ref: user-request-this-chat
  does_not_prove:
  - production readiness
  - high availability
  - command rollback
business:
  actor: tenant administrators and device operators
  workflow: enroll devices, grant access, operate terminal/files/web, revoke access
  problem: single long management page and terminal gray theme make administration
    cluttered
  baseline: a851304 stacks all management sections
  target: separate navigable functional sections with legible light surfaces and clear
    hierarchy
  outcome: independently usable authenticated remote maintenance platform
  evidence_sources:
  - DELIVERY.md
  - scripts/tenant-e2e.py
  - cmd/tenant-e2e/main.go
  outcome_measurement:
    status: planned
    metrics:
    - name: authorized_and_denied_behavior
      direction: threshold
      baseline: no tenant isolation
      target: all required negative and positive paths pass
      source: evidence delivery receipt
    observation_window: local and isolated 204 test run
    reason: ''
harness:
  bootstrap:
    status: available
    probe: go build ./cmd/rttys
  reset:
    status: available
    probe: scripts/run-local-e2e.py creates disposable SQLite fixture
  focused_test:
    status: available
    probe: python3 scripts/run-local-e2e.py
  ground_truth:
    status: available
    probe: compare transport observations with user-defined policy in DELIVERY.md
    oracle_kind: human_gold
    uri: DELIVERY.md
    digest: ''
    independent_from_sut_input: true
  fixtures:
    status: available
    probe: synthetic tenants and devices plus NVIDIA 172.21.0.156
  architecture_check:
    status: not_applicable
    reason: manual security boundary review and full transport checks cover this single-process
      fork
  secret_policy: redact
allowed_paths:
- cmd/**
- internal/**
- ui/**
- scripts/**
- go.mod
- go.sum
- contract.yaml
- DELIVERY.md
- .gitignore
- README-TENANT.md
- THIRD_PARTY.md
- install-rtty
non_goals:
- production cutover
- SSO
- clustering
- shell command sandbox
- serial and sharing
invariants:
- tenant identity is derived from authenticated membership and enrolled credentials
- existing edge-manager edits and other remote services are untouched
- no secrets are committed
acceptance:
- id: DL-1
  given: new browser terminal and existing device client
  when: negotiate a16-block download window
  then: at most16 unconsumed chunks and exactly one device ACK in flight; ordinary
    payload integrity preserved
- id: DL-2
  given: active and sequential downloads
  when: cancel, deliver stale ACK/cancel or disconnect and reconnect
  then: next file is isolated, terminal remains usable after cancel, reconnected session
    downloads intact
- id: DL-3
  given: 204 server and174 real device
  when: run8MiB transfers with the new protocol
  then: speed and integrity are recorded; cancel, repeated files, reconnect and cleanup
    pass
proof:
  evidence_tier: deployment-real
  acceptance_owner: user
  artifact_root: external daily memo rttys-tenant
  commands:
  - python3 scripts/run-local-e2e.py
  - deployed real-device acceptance
rollback: Restore pre-window server binary and restart only rttys-tenant-poc on204;
  database and client protocol unchanged.
open_questions: []
execution:
  environments:
    local: read-write
    test: read-write
    production: forbidden
