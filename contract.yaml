plane_work_item: local-rttys-tenant
slice: device soft deletion, confirmed credential reset, registration metadata and
  client installer
lane: high-risk
base_branch: master
claim:
  kind: integration_health
  statement: Deleted devices cannot reconnect, reset invalidates old tokens, actual
    registration identity is visible and searchable, installer verifies registration
  intent_ref: user-request-this-chat
  does_not_prove:
  - production readiness
  - high availability
  - command rollback
business:
  actor: tenant administrators and device operators
  workflow: enroll devices, grant access, operate terminal/files/web, revoke access
  problem: single long management page and terminal gray theme make administration
    cluttered
  baseline: a851304 stacks all management sections
  target: separate navigable functional sections with legible light surfaces and clear
    hierarchy
  outcome: independently usable authenticated remote maintenance platform
  evidence_sources:
  - DELIVERY.md
  - scripts/tenant-e2e.py
  - cmd/tenant-e2e/main.go
  outcome_measurement:
    status: planned
    metrics:
    - name: authorized_and_denied_behavior
      direction: threshold
      baseline: no tenant isolation
      target: all required negative and positive paths pass
      source: evidence delivery receipt
    observation_window: local and isolated 204 test run
    reason: ''
harness:
  bootstrap:
    status: available
    probe: go build ./cmd/rttys
  reset:
    status: available
    probe: scripts/run-local-e2e.py creates disposable SQLite fixture
  focused_test:
    status: available
    probe: python3 scripts/run-local-e2e.py
  ground_truth:
    status: available
    probe: compare transport observations with user-defined policy in DELIVERY.md
    oracle_kind: human_gold
    uri: DELIVERY.md
    digest: ''
    independent_from_sut_input: true
  fixtures:
    status: available
    probe: synthetic tenants and devices plus NVIDIA 172.21.0.156
  architecture_check:
    status: not_applicable
    reason: manual security boundary review and full transport checks cover this single-process
      fork
  secret_policy: redact
allowed_paths:
- cmd/**
- internal/**
- ui/**
- scripts/**
- go.mod
- go.sum
- contract.yaml
- DELIVERY.md
- .gitignore
- README-TENANT.md
- THIRD_PARTY.md
- install-rtty
non_goals:
- production cutover
- SSO
- clustering
- shell command sandbox
- serial and sharing
invariants:
- tenant identity is derived from authenticated membership and enrolled credentials
- existing edge-manager edits and other remote services are untouched
- no secrets are committed
acceptance:
- id: LIFE-1
  given: tenant-scoped enrolled device
  when: administrator soft-deletes it
  then: device disappears, all access closes, credential fails and audit tombstone
    persists
- id: LIFE-2
  given: device credential and established connection
  when: administrator confirms reset twice and provides exact device identity
  then: old credential is rejected, new credential registers, token and audit change
    atomically
- id: LIFE-3
  given: a client registers with identity and description
  when: list or search devices, disconnect or restart server
  then: actual registration id and description persist and remain searchable independently
    from admin name
- id: INSTALL-1
  given: ARM64 NVIDIA174 and complete checked installation bundle
  when: install with correct credential and exercise a failed update
  then: TLS registration and terminal/file roundtrip succeed; invalid update restores
    previous files/service
proof:
  evidence_tier: deployment-real
  acceptance_owner: user
  artifact_root: external daily memo rttys-tenant
  commands:
  - python3 scripts/run-local-e2e.py
  - deployed real-device acceptance
rollback: Restore matched pre-lifecycle binary and stopped SQLite backup on204; installer
  restores client files/unit on174. No production deployment.
open_questions: []
execution:
  environments:
    local: read-write
    test: read-write
    production: forbidden
