# Replace with the receiving tenant's internal ID before use.
device-auth-mode: compat
device-compat-tenant: REPLACE_WITH_ENABLED_TENANT_ID
# false: only pre-enrolled devices; true: enroll unknown legacy IDs (tenant cap1000).
device-compat-auto-enroll: false
# Set true ONLY for old clients using plaintext TCP. The web panel stays HTTPS.
device-compat-plaintext: false
